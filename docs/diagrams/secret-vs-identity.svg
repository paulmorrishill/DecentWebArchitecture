<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="On the left the application holds a database login and reaching tenant B is allowed. On the right the application holds no credential and the data service refuses the read.">
  <title>A secret the application holds is not a barrier against the application</title>
  <desc>Left: the application holds the database login, so one edited line connects as tenant B and the store allows it. Right: the application holds no credential, so the data service checks the caller's own identity and refuses anything outside tenant A.</desc>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <defs>
    <marker id="aBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="aGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <style>
    .panel { font: 700 14px -apple-system, "Segoe UI", Arial, sans-serif; letter-spacing: .04em; }
    .box   { font: 600 14px -apple-system, "Segoe UI", Arial, sans-serif; fill: #24323f; }
    .sub   { font: 400 12.5px -apple-system, "Segoe UI", Arial, sans-serif; fill: #5b6b7f; }
    .edge  { font: 600 12.5px -apple-system, "Segoe UI", Arial, sans-serif; }
    .verd  { font: 700 14px -apple-system, "Segoe UI", Arial, sans-serif; }
  </style>

  <!-- ─────────── left: permeable ─────────── -->
  <rect x="10" y="16" width="420" height="368" rx="14" fill="#fff8f7" stroke="#c0392b" stroke-width="2"/>
  <text x="30" y="46" class="panel" fill="#c0392b">PERMEABLE — the application holds the secret</text>

  <rect x="40" y="70" width="360" height="74" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="98" class="box">Application</text>
  <text x="60" y="118" class="sub">holds the database login for every tenant</text>
  <text x="60" y="136" class="sub">one edited line changes which one it uses</text>

  <line x1="220" y1="150" x2="220" y2="214" stroke="#c0392b" stroke-width="3" marker-end="url(#aBad)"/>
  <text x="232" y="188" class="edge" fill="#c0392b">connect as tenant B</text>

  <path d="M 40 232 h 360 v 86 a 180 16 0 0 1 -360 0 z" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <ellipse cx="220" cy="232" rx="180" ry="16" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="266" class="box">Data store</text>
  <text x="60" y="286" class="sub">the password is valid,</text>
  <text x="60" y="304" class="sub">so the read is allowed</text>

  <text x="220" y="356" class="verd" fill="#c0392b" text-anchor="middle">Tenant B's data is returned</text>

  <!-- ─────────── right: impermeable ─────────── -->
  <rect x="470" y="16" width="420" height="368" rx="14" fill="#f6fdf8" stroke="#1e8449" stroke-width="2"/>
  <text x="490" y="46" class="panel" fill="#1e8449">IMPERMEABLE — the application holds nothing</text>

  <rect x="500" y="70" width="360" height="74" rx="10" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <text x="520" y="98" class="box">Application</text>
  <text x="520" y="118" class="sub">holds no credential at all</text>
  <text x="520" y="136" class="sub">editing it changes nothing below</text>

  <line x1="680" y1="150" x2="680" y2="214" stroke="#1e8449" stroke-width="3" marker-end="url(#aGood)"/>
  <text x="692" y="188" class="edge" fill="#1e8449">read B#…</text>

  <path d="M 500 232 h 360 v 86 a 180 16 0 0 1 -360 0 z" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <ellipse cx="680" cy="232" rx="180" ry="16" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <text x="520" y="266" class="box">Data service</text>
  <text x="520" y="286" class="sub">checks the CALLER'S own identity,</text>
  <text x="520" y="304" class="sub">which may touch only A#</text>

  <text x="680" y="356" class="verd" fill="#1e8449" text-anchor="middle">Refused. The policy is not in the repository</text>
</svg>
